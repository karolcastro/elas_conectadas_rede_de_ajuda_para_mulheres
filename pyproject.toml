[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "elas-conectadas-mcp"
version = "0.1.0"
description = "Servidor MCP do Elas Conectadas com conectores para fontes públicas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]==2.3.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.3",
  "bandit[toml]>=1.7,<2.0",
  "pip-audit>=2.7,<3.0",
]

[project.scripts]
elas-conectadas-mcp = "elas_conectadas_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elas_conectadas_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
