[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "elas-conectadas-mcp"
version = "0.1.0"
description = "Servidor MCP do Elas Conectadas com conectores para fontes públicas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]

[project.scripts]
elas-conectadas-mcp = "elas_conectadas_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elas_conectadas_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
